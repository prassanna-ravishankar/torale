{{- /*
The legacy runtime /config.js ConfigMap (window.CONFIG) is retired.

The Vite app read window.CONFIG at runtime so an nginx-served /config.js
could be swapped per environment without rebuilding. Next.js inlines
NEXT_PUBLIC_* into client bundles at build time, so per-environment values
move to docker --build-arg (see Dockerfile) and to the runtime env block
in templates/frontend-deployment.yaml.

This file is kept as a stub so `helm upgrade` cleans up the previous
ConfigMap object. Once a release has applied the empty template (and the
old ConfigMap has been garbage-collected), the file can be deleted.
*/ -}}
