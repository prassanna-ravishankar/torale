# Backend PR checks: lint and test
# Runs on pull requests to ensure code quality

name: Backend PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'torale-agent/**'
      # Backend tests enforce the mirrored ConnectionStatus union in this file.
      - 'frontend/src/types/index.ts'
      - '.github/workflows/backend-pr.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Copy README for package metadata
        run: cp README.md backend/README.md

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Run ruff check
        working-directory: ./backend
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: ./backend
        run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Copy README for package metadata
        run: cp README.md backend/README.md

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-extras

      - name: Run pytest
        working-directory: ./backend
        run: uv run pytest --cov=webwhen --cov-report=term-missing --cov-report=xml

  agent-lint:
    name: Agent lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "torale-agent/uv.lock"

      - name: Install agent dependencies
        working-directory: ./torale-agent
        run: uv sync --all-groups

      - name: Run agent checks
        working-directory: ./torale-agent
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check .
          uv run python -c "import server"

  agent-test:
    name: Agent tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "torale-agent/uv.lock"

      - name: Install agent dependencies
        working-directory: ./torale-agent
        run: uv sync --all-groups

      - name: Run agent tests
        working-directory: ./torale-agent
        run: uv run pytest tests -v
