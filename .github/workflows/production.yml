# Production deployment workflow
# Simplified: Build → Deploy (no separate scan step)
# Uses Google Container Registry (gcr.io) for native GKE integration via Workload Identity
# Maintains GKE deployment via Helmfile

name: Deploy to Production

# Default least-privilege for all jobs. Build + deploy jobs override below
# to add `id-token: write` for GCP Workload Identity Federation.
permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy. Defaults to main.'
        required: false
        default: 'main'
      extra_values:
        description: 'Optional helm values overlay to layer on top of values-production.yaml (e.g. helm/torale/values-webwhen-soak.yaml). Empty for a normal prod sync.'
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: clusterkit
  GKE_REGION: us-central1
  # On push events, inputs.ref is empty so we fall through to github.sha.
  # On workflow_dispatch, the job's `actions/checkout` step receives inputs.ref
  # via the `with: ref:` parameter so the build runs against the requested
  # branch; IMAGE_TAG still tags by github.sha (the resolved commit on that
  # ref) so the deployed image is addressable in GCR.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate structure
        run: |
          echo "🔍 Validating project structure..."
          test -f backend/Dockerfile || (echo "❌ backend/Dockerfile missing" && exit 1)
          test -f frontend/Dockerfile || (echo "❌ frontend/Dockerfile missing" && exit 1)
          test -f docs-site/Dockerfile || (echo "❌ docs-site/Dockerfile missing" && exit 1)
          test -f torale-agent/Dockerfile || (echo "❌ torale-agent/Dockerfile missing" && exit 1)
          test -f helmfile.yaml.gotmpl || (echo "❌ helmfile.yaml.gotmpl missing" && exit 1)
          test -d helm/torale || (echo "❌ helm/torale missing" && exit 1)
          echo "✅ All files present"

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write  # Required for GCP OIDC

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: docs
            context: docs-site
            dockerfile: docs-site/Dockerfile
          - component: agent
            context: torale-agent
            dockerfile: torale-agent/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      # Stage backend/static/changelog.json inside the frontend build
      # context so the SSG fallback in app/(marketing)/changelog/page.tsx
      # can read it when the API isn't reachable at image-build time. The
      # frontend Docker context is `frontend/` only.
      - name: Stage changelog fixture for frontend build
        if: matrix.component == 'frontend'
        run: cp backend/static/changelog.json frontend/.changelog-fixture.json

      # Next.js inlines NEXT_PUBLIC_* into the client bundle at build time,
      # so the per-environment public config (API host, Clerk PK, PostHog
      # key) MUST be passed as Docker --build-arg here. Values mirror
      # helm/torale/values-production.yaml (kept in sync manually; both
      # files carry public-safe keys per the Clerk + PostHog comments).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false  # Prevent manifest list creation that breaks tagging with GHA cache
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.webwhen.ai
            NEXT_PUBLIC_SITE_ORIGIN=https://webwhen.ai
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsud2Vid2hlbi5haSQ
            NEXT_PUBLIC_POSTHOG_API_KEY=phc_aBJidBfDmxU0jaAn6K1168Ob6sGDdOc9hVImLHCTCWJ
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.posthog.com
          tags: |
            gcr.io/${{ env.GCP_PROJECT_ID }}/torale-${{ matrix.component }}:${{ env.IMAGE_TAG }}
            gcr.io/${{ env.GCP_PROJECT_ID }}/torale-${{ matrix.component }}:latest
          cache-from: |
            type=gha
            type=registry,ref=gcr.io/${{ env.GCP_PROJECT_ID }}/torale-${{ matrix.component }}:latest
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write  # Required for OIDC

    environment:
      name: production
      url: https://torale.ai

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Deploy via Helmfile
        uses: helmfile/helmfile-action@v2.0.5
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          # Optional helm values overlay (e.g. soak window, hotfix-from-branch).
          # Empty on push events; set via workflow_dispatch input. Helmfile
          # honours it via the EXTRA_VALUES env var below in helmfile.yaml.gotmpl.
          EXTRA_VALUES: ${{ inputs.extra_values }}
        with:
          helmfile-version: v0.162.0
          helm-version: v3.19.0
          helm-plugins: https://github.com/databus23/helm-diff@v3.9.4
          helmfile-args: sync --selector tier=app

      - name: Verify deployment
        run: |
          echo "✅ Verifying deployment..."
          kubectl rollout status deployment/torale-api -n torale --timeout=5m
          kubectl rollout status deployment/torale-frontend -n torale --timeout=5m
          kubectl rollout status deployment/torale-docs -n torale --timeout=5m
          kubectl rollout status deployment/torale-agent-free -n torale --timeout=5m
          kubectl rollout status deployment/torale-agent-paid -n torale --timeout=5m

      - name: Deployment summary
        run: |
          echo "🎉 Production deployment completed!"
          echo ""
          kubectl get pods -n torale -o wide
          echo ""
          kubectl get httproute -n torale
