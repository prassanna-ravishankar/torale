# Fixture: trailing spaces AFTER closing `"` on quoted scalars.
# Pins a known parser limitation: in extract_helm_kv, `gsub(/^"|"$/, "")`
# runs BEFORE `sub(/[[:space:]]+$/, "")`, so a closing quote not at the
# end of the line is not stripped. Parity must therefore report drift
# on NEXT_PUBLIC_POSTHOG_API_KEY when compared against the canonical
# workflow.
#
# If a future PR fixes the parser to handle this case, update the
# scenario in check-public-env-parity.test.sh deliberately.
